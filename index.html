<body>
    <div id="carousel">
        <img id="carouselImage" src="" alt="Preview" style="width:300px;height:200px;">
    </div>
    <br>
    <input type="file" id="fileInput" onchange="loadCarousel(event)" accept=".jpg,.png,.jpeg" multiple>
    <br>
    <button onclick="prevImage()">Previous</button>
    <button onclick="nextImage()">Next</button>

    <script>
        let images = JSON.parse(localStorage.getItem('myImages')) || [];
        let currentIndex = 0;

        // Show first stored image if available
        if (images.length > 0) {
            document.getElementById('carouselImage').src = images[0];
        }

        function loadCarousel(ev) {
            const files = ev.target.files;
            images = []; // reset
            currentIndex = 0;

            Array.from(files).forEach((file, idx) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    images.push(e.target.result);
                    if (idx === 0) {
                        document.getElementById('carouselImage').src = e.target.result;
                    }
                };
                reader.readAsDataURL(file);
            });
            if (images.length === files.length) {
                localStorage.setItem('myImages', JSON.stringify(images));
            }
        }

        function showImage(index) {
            if (images.length > 0) {
                document.getElementById('carouselImage').src = images[index];
            }
        }

        function prevImage() {
            if (images.length > 0) {
                currentIndex = (currentIndex - 1 + images.length) % images.length;
                showImage(currentIndex);
            }
        }

        function nextImage() {
            if (images.length > 0) {
                currentIndex = (currentIndex + 1) % images.length;
                showImage(currentIndex);
            }
        }
    </script>
</body>
